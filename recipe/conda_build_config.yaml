# python pinned to match ROOT's own build: hep-forge's root packages
# are published for one python per version family (6.34/6.36/6.38 ->
# 3.12, 6.32 -> 3.10); without this pin, conda-build tries conda-forge's
# global default python matrix (3.9-3.13), and any slot ROOT wasn't
# built for is unsatisfiable under strict channel priority (it won't
# fall back to conda-forge's own differently-versioned root package).
python:
  - "3.12"

c_stdlib:
  - sysroot                    # [linux]
  - macosx_deployment_target   # [osx]

c_stdlib_version:              # [unix]
  - 2.17                       # [linux]
  - 11.0                       # [osx]

c_compiler:
  - gcc
cxx_compiler:
  - gxx

# must match hepmc/edm4hep/podio's own root build (all root638) --
# dd4hep pins `hepmc>=3.2.6 root{{ root_tag }}` etc, so a mismatched
# root variant here would be unsatisfiable at solve time.
root:
  - 6.38

# ---- Compiler floor (ABI)
# Pin the compiler major instead of inheriting conda-build's "newest
# available". Unpinned, each rebuild silently takes whatever conda-forge
# shipped most recently -- that is how minio-cpp moved from GCC 15 to 16
# between two rebuilds and stopped compiling, GCC 16 defaulting to C++20
# where a defaulted constructor stops a struct being an aggregate.
# 14 is the oldest major still current for both linux-64 and
# linux-aarch64; binaries built against libstdcxx 14 keep running on
# newer runtimes, while the reverse fails on missing GLIBCXX symbols.
# A floor, not a ceiling: raise it per-package for sources that really
# need a newer toolchain.
# NB this pins the *ABI*. It only fixes the C++ *dialect* as a side
# effect (14 defaults to gnu++17); source that requires a particular
# standard should set CMAKE_CXX_STANDARD explicitly as well.
c_compiler_version:    # [linux]
  - 14
cxx_compiler_version:  # [linux]
  - 14
libgcc_version:        # [linux]
  - 14.*
libstdcxx_version:     # [linux]
  - 14.*
